schema_version: "1.0"
name: fetech-beta-context-acceptance
default_token_budget: 4000
targets:
  minimum_tasks: 100
  minimum_repository_words: 5000
  minimum_median_token_reduction_percent: 70.0
  maximum_bundle_tokens: 4000
  minimum_relevant_evidence_recall_percent: 95.0
  maximum_answer_correctness_drop_points: 2.0
  minimum_lineage_coverage_percent: 100.0
  maximum_full_vault_loads: 0
  maximum_qmd_notes_per_bundle: 3
baseline_globs:
  code_architecture:
    - src/fetech/*.py
    - src/fetech/**/*.py
    - tests/*.py
  runtime_history:
    - src/fetech/*.py
    - src/fetech/**/*.py
    - docs/context-broker.md
    - docs/extraction-provenance.md
    - docs/failure-semantics.md
  decision_history:
    - README.md
    - SECURITY.md
    - CONTRIBUTING.md
    - docs/*.md
    - docs/**/*.md
